# Rootless Podman compose file.
#
# Run it with:  podman-compose -f deploy/compose.yaml up -d
#
# This is the development shape. Production uses the systemd units in this
# directory instead, because they express the isolation this file can only
# approximate - in particular the signer's complete lack of a network.
version: "3.8"

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: acs
    volumes:
      - acs-pgdata:/var/lib/postgresql/data
    # Never published. Only the internal network reaches it.
    networks: [acs-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  signer:
    build:
      context: ..
      dockerfile: Containerfile.signer
    environment:
      ACS_SIGNER_SOCKET: /run/acs-signer/signer.sock
      ACS_SIGNER_PRIVATE_KEY: ${ACS_SIGNER_PRIVATE_KEY:?set it in .env}
      ACS_SIGNER_KEY_ID: ${ACS_SIGNER_KEY_ID:-signer-1}
    volumes:
      - acs-signer-sock:/run/acs-signer
    # No network at all. The signer cannot reach the database, the internet,
    # or any other container - only the socket it listens on.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    build:
      context: ..
      dockerfile: Containerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACS_ENV: production
      ACS_DB_DSN: ${ACS_DB_DSN:?set it in .env}
      ACS_AUDIT_DB_DSN: ${ACS_AUDIT_DB_DSN:?set it in .env}
      ACS_TOKEN_PEPPER: ${ACS_TOKEN_PEPPER:?set it in .env}
      ACS_SIGNER_SOCKET: /run/acs-signer/signer.sock
      ACS_SIGNER_PUBLIC_KEY: ${ACS_SIGNER_PUBLIC_KEY:?set it in .env}
      ACS_SIGNER_KEY_ID: ${ACS_SIGNER_KEY_ID:-signer-1}
      ACS_TRUSTED_PROXIES: ${ACS_TRUSTED_PROXIES:-127.0.0.1/32}
      ACS_ATTESTATION_MODE: strict
      ACS_PLAY_INTEGRITY_PACKAGE_NAME: ${ACS_PLAY_INTEGRITY_PACKAGE_NAME:-}
      ACS_ANDROID_CERT_DIGEST: ${ACS_ANDROID_CERT_DIGEST:-}
    volumes:
      - acs-signer-sock:/run/acs-signer
    # Published to loopback only. The tunnel or reverse proxy is what faces
    # the internet, not this port.
    ports:
      - "127.0.0.1:8080:8080"
    networks: [acs-internal]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  admin:
    build:
      context: ..
      dockerfile: Containerfile.admin
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACS_ENV: production
      ACS_DB_DSN: ${ACS_DB_DSN:?set it in .env}
      ACS_AUDIT_DB_DSN: ${ACS_AUDIT_DB_DSN:?set it in .env}
      ACS_TOKEN_PEPPER: ${ACS_TOKEN_PEPPER:?set it in .env}
      ACS_ADMIN_HOST: 127.0.0.1
      ACS_ADMIN_ALLOWED_CIDRS: ${ACS_ADMIN_ALLOWED_CIDRS:-127.0.0.1/32}
    ports:
      - "127.0.0.1:8081:8081"
    networks: [acs-internal]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  acs-internal:
    driver: bridge
    internal: true

volumes:
  acs-pgdata:
  acs-signer-sock:
