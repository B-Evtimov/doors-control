# Example reverse proxy configuration. Host names are placeholders.
#
# The API is the only thing published. The admin application deliberately has
# no server block here: it is not addressable from the internet at all.

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.invalid;

    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;

    # The phone talks to these.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 32k;
        proxy_read_timeout   30s;
    }

    # The controllers dial in here and keep the socket open.
    location /ws/controller {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Long lived by design. The application's own heartbeat decides when
        # a controller is gone, not this timeout.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Anything else gets nothing. No directory listing, no default app, no
    # hint that there is an admin panel somewhere.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name api.example.invalid;
    return 301 https://$host$request_uri;
}
