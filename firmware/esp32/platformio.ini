[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

build_unflags = -std=gnu++11

lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^1.4.2
    rweather/Crypto@^0.4.0

board_build.partitions = partitions.csv

; The firmware is small; the space goes to two OTA slots so that a bad update
; rolls back instead of bricking a door.
